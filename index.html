    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(10, 25, 47, 0.96);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid rgba(255,255,255,0.08);

      padding: 14px 20px;
    }

    .nav-inner {
      max-width: 1120px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: white;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span {
      color: #55a8ff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links a {
      color: #dce8f7;
      font-size: 14px;
      font-weight: 600;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .nav-links a:hover {
      color: white;
      transform: translateY(-1px);
    }

    .nav-order {
      background: #1d6cff;
      color: white !important;

      padding: 9px 17px;
      border-radius: 999px;

      box-shadow: 0 7px 20px rgba(29,108,255,0.28);
    }

    .nav-order:hover {
      background: #0f5eea;
    }

    }

      background: rgba(72,158,255,0.08);

      left: -100px;

      gap: 50px;

      background: rgba(255,255,255,0.07);

      color: #cfe6ff;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 20px;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #56d39b;
    }
