<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BMARPC BAGS | Student Backpack</title>

  <meta
    name="description"
    content="BMARPC BAGS — an affordable, practical and stylish college bag made for students. Order online for ৳600."
  >

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    ::selection {
      background: #1d6cff;
      color: white;
    }

    /* NAVIGATION */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 25, 47, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 20px;
    }

    .nav-inner {
      max-width: 1120px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: white;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .brand span {
      color: #55a8ff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links a {
      color: #dce8f7;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .nav-links a:hover {
      color: white;
      transform: translateY(-1px);
    }

    .nav-order {
      background: #1d6cff;
      color: white !important;
      padding: 9px 17px;
      border-radius: 999px;
      box-shadow: 0 7px 20px rgba(29,108,255,0.28);
    }

    .nav-order:hover {
      background: #0f5eea;
    }

    /* HERO */

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 20%, rgba(55,143,255,0.28), transparent 30%),
        linear-gradient(135deg, #08192f 0%, #0c2c50 52%, #123d68 100%);
      color: white;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: rgba(72,158,255,0.08);
      top: -150px;
      left: -100px;
    }

    .hero-inner {
      max-width: 1120px;
      margin: auto;
      min-height: 600px;
      padding: 70px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 50px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      color: #cfe6ff;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #56d39b;
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 70px);
      line-height: 1.02;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: #55a8ff;
    }

    .hero-text {
      max-width: 540px;
      color: #c8d8ea;
      font-size: 18px;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-primary,
    .hero-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 10px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .hero-primary {
      background: #1d6cff;
      color: white;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(29,108,255,0.3);
    }

    .hero-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 35px rgba(29,108,255,0.4);
    }

    .hero-secondary {
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-weight: 700;
      background: rgba(255,255,255,0.06);
    }

    .hero-secondary:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }

    .hero-price {
      margin-top: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-price strong {
      font-size: 31px;
    }

    .hero-price small {
      color: #a9bed5;
      font-size: 13px;
    }

    /* HERO PRODUCT IMAGE */

    .hero-product {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-product-card {
      position: relative;
      width: min(460px, 100%);
      padding: 25px;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow: 0 30px 70px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      animation: floatingBag 5s ease-in-out infinite;
    }

    @keyframes floatingBag {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .hero-product-card img {
      width: 100%;
      height: 430px;
      object-fit: contain;
      display: block;
      border-radius: 20px;
      background: white;
    }

    .floating-price {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: white;
      color: #10233f;
      padding: 12px 18px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    .floating-price small {
      display: block;
      color: #66758a;
      font-size: 11px;
      font-weight: 700;
    }

    .floating-price strong {
      font-size: 22px;
    }

    /* MAIN CONTAINER */

    .container {
      max-width: 1120px;
      margin: auto;
      padding: 70px 20px 80px;
    }

    /* SECTION HEADINGS */

    .section-heading {
      text-align: center;
      max-width: 650px;
      margin: 0 auto 38px;
    }

    .section-heading .mini {
      color: #1d6cff;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
      color: #12233d;
      margin-bottom: 10px;
    }

    .section-heading p {
      color: #65748a;
    }

    /* STUDENT FEATURES */

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 75px;
    }

    .feature-card {
      background: white;
      border: 1px solid #e8edf4;
      border-radius: 18px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(25,45,75,0.05);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .feature-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(25,45,75,0.1);
    }

    .feature-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      border-radius: 15px;
      background: #edf5ff;
      font-size: 25px;
    }

    .feature-card h3 {
      font-size: 16px;
      margin-bottom: 5px;
      color: #142641;
    }

    .feature-card p {
      color: #718096;
      font-size: 13px;
    }
